<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章管理后台 · ChatGPT 洞察</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- Decap CMS 会自动在此挂载可视化后台界面。
       3.17.3 起支持「行内组件」，用于给选中文字改颜色而不破坏段落。 -->
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
  <script>
    // ===== 工具：HTML 转义 / 反转义（用于行内组件的 markdown 存取）=====
    function cmsEscapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function cmsUnescapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    }

    // ===== 自定义选色弹窗：返回 Promise，选中后 resolve({color, bold})，取消 resolve(null) =====
    // 说明：行内颜色文字是一个整体，不能再被工具栏单独加粗，所以把「加粗」放进弹窗一次设置。
    function cmsPickColor() {
      return new Promise(function (resolve) {
        var palette = [
          { name: '红', value: '#e11d48' }, { name: '橙', value: '#ea580c' },
          { name: '金', value: '#d97706' }, { name: '绿', value: '#16a34a' },
          { name: '青', value: '#0891b2' }, { name: '蓝', value: '#2563eb' },
          { name: '紫', value: '#7c3aed' }, { name: '黑', value: '#1f2937' }
        ];
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",sans-serif;';
        var box = document.createElement('div');
        box.style.cssText = 'background:#fff;border-radius:14px;padding:26px 26px 20px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:340px;max-width:90vw;';
        box.innerHTML =
          '<div style="font-size:17px;font-weight:800;color:#111827;margin-bottom:4px">🎨 选择文字颜色</div>' +
          '<div style="font-size:13px;color:#6b7280;margin-bottom:20px">已选中文字，点一个颜色即可</div>' +
          '<div id="cms-color-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div>' +
          '<label style="display:flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;color:#374151;cursor:pointer;user-select:none">' +
            '<input type="checkbox" id="cms-color-bold" style="width:16px;height:16px;cursor:pointer">同时加粗（想要又红又粗就勾上）</label>' +
          '<div style="margin-top:20px;text-align:right"><button id="cms-color-cancel" style="padding:8px 18px;border:none;background:#f3f4f6;color:#374151;border-radius:8px;cursor:pointer;font-size:14px">取消</button></div>';
        overlay.appendChild(box);
        document.body.appendChild(overlay);

        function cleanup() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
        var grid = box.querySelector('#cms-color-grid');
        var boldBox = box.querySelector('#cms-color-bold');
        palette.forEach(function (c) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.title = c.name;
          btn.textContent = c.name;
          btn.style.cssText = 'height:46px;border:2px solid ' + c.value + ';background:' + c.value + ';color:#fff;font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;transition:transform .15s';
          btn.onmouseenter = function () { btn.style.transform = 'scale(1.06)'; };
          btn.onmouseleave = function () { btn.style.transform = 'scale(1)'; };
          btn.onclick = function () {
            var bold = !!(boldBox && boldBox.checked);
            cleanup(); resolve({ color: c.value, bold: bold });
          };
          grid.appendChild(btn);
        });
        box.querySelector('#cms-color-cancel').onclick = function () { cleanup(); resolve(null); };
        overlay.onclick = function (e) { if (e.target === overlay) { cleanup(); resolve(null); } };
      });
    }

    // ===== 注册「文字颜色」行内组件：选中文字 -> 上色（可选加粗），不新起段落 =====
    if (typeof CMS !== 'undefined' && CMS.registerEditorComponent) {
      CMS.registerEditorComponent({
        id: 'color-text',
        label: '🎨 文字颜色',
        icon: 'paint-brush',
        type: 'inline',
        // 行内 pattern：匹配带可选加粗的 span，兼容旧格式（无 font-weight）
        // match[1]=颜色, match[2]=加粗标志或 undefined, match[3]=文字
        pattern: /<span class="cms-color" style="color:([^;"<]+);(font-weight:800;)?">([\s\S]*?)<\/span>/,
        fromInline: function (match) {
          return {
            text: cmsUnescapeHtml(match[3] || ''),
            color: match[1] || '#e11d48',
            bold: !!match[2]
          };
        },
        toInline: function (data) {
          var color = String(data.color || '#e11d48').replace(/["<>;]/g, '');
          var style = 'color:' + color + ';';
          if (data.bold) style += 'font-weight:800;';
          return '<span class="cms-color" style="' + style + '">' + cmsEscapeHtml(data.text) + '</span>';
        },
        toPreview: function (data) {
          // 返回 React 元素，让编辑区里直接显示带颜色（及加粗）的文字，而不是 HTML 源码
          var color = String(data.color || '#e11d48').replace(/["<>;]/g, '');
          var style = { color: color };
          if (data.bold) style.fontWeight = '800';
          if (typeof h === 'function') {
            return h('span', { style: style }, String(data.text || ''));
          }
          return String(data.text || '');
        },
        onInsert: function (ctx) {
          var text = (ctx && ctx.selectedText) || '';
          if (!text.trim()) {
            window.alert('请先选中要变色的文字，再点「🎨 文字颜色」。');
            return Promise.resolve(null);
          }
          return cmsPickColor().then(function (res) {
            if (!res) return null;
            return { text: text, color: res.color, bold: res.bold };
          });
        }
      });
    }

    // 后台右侧预览沿用站点样式（预览模板用 Decap 默认实现，避免自定义模板报错）
    if (typeof CMS !== 'undefined' && CMS.registerPreviewStyle) {
      CMS.registerPreviewStyle('../css/style.css');
    }
  </script>
</body>
</html>
