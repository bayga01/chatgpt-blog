# ============================================================
# Decap CMS 配置（可视化发文后台）
# 管理文件：data/posts.json
# 你几乎不需要改这个文件——后台界面由它自动生成。
# 唯一要改的是下面的 backend.repo（改成你自己的 GitHub 仓库）。
# ============================================================
backend:
  name: github
  # GitHub 用户名/仓库名（已按你的账号填好）
  repo: bayga01/chatgpt-blog
  branch: main
  # 认证走本站自带的 Cloudflare Pages Function（functions/api/），无需额外服务
  # 注意：base_url 必须是完整域名，不能写 / —— 否则 Decap CMS 会回退到 api.netlify.com 导致登录失败
  base_url: https://dianlijuhe.com
  auth_endpoint: api/auth

# 站点标题（后台左上角显示）
site_url: https://dianlijuhe.com/
display_url: https://dianlijuhe.com/
logo_url: https://dianlijuhe.com/images/logo.svg

# 上传图片/附件保存的目录（会提交到仓库）
media_folder: "images/uploads"
public_folder: "/images/uploads"

# ---------------- 内容集合 ----------------
collections:
  - name: "posts"
    label: "📝 文章管理"
    label_singular: "文章"
    description: "在这里发布、编辑、删除文章。保存后网站会自动更新。"
    files:
      - label: "全部文章"
        name: "posts"
        file: "data/posts.json"
        fields:
          - label: "文章列表"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "文章标题", name: "title", widget: "string", hint: "文章的标题" }
              - { label: "网址标识 (slug)", name: "slug", widget: "string", hint: "英文小写+连字符，如 my-first-post。决定文章链接地址，发布后尽量不要改。" }
              - label: "分类"
                name: "category"
                widget: "select"
                options:
                  - { label: "chatGPT", value: "chatGPT" }
                  - { label: "Claude", value: "Claude" }
                  - { label: "gemini", value: "gemini" }
                  - { label: "使用技巧", value: "使用技巧" }
                  - { label: "常见问题", value: "常见问题" }
              - { label: "发布日期", name: "date", widget: "date", format: "YYYY-MM-DD", required: false }
              - { label: "阅读时长", name: "readTime", widget: "string", default: "6 分钟", hint: "如 8 分钟", required: false }
              - { label: "作者", name: "author", widget: "string", default: "编辑部", required: false }
              - { label: "封面图标", name: "emoji", widget: "string", default: "📄", hint: "一个 emoji，如 🚀", required: false }
              - { label: "封面图片（精选大图）", name: "cover", widget: "image", hint: "可选。上传一张横图（建议 16:9），设为精选后会显示在首页「本周精选」的大图位置；不传则显示封面图标。", required: false }
              - { label: "摘要", name: "excerpt", widget: "text", hint: "一两句话的简介，显示在卡片和分享卡片上", required: false }
              - { label: "搜索关键词", name: "keywords", widget: "string", hint: "用空格分隔的关键词，方便站内搜索", required: false }
              - { label: "设为首页精选", name: "featured", widget: "boolean", default: false, hint: "开启后这篇文章会显示在首页「本周精选」" }
              - label: "正文"
                name: "content"
                widget: "markdown"
                hint: "工具栏可插入标题、链接、图片、列表。想改文字颜色：先选中要变色的文字，再点工具栏的「+」→ 选「🎨 文字颜色」→ 选颜色即可，不会打乱段落；想同时加粗就在弹窗里勾上「同时加粗」。外部链接：选中文字后点「链接」粘贴网址。"
