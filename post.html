<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章详情 - AI聚合</title>
  <meta name="description" content="ChatGPT 实战教程与深度解读。">
  <meta name="author" content="聚合平台-chatGPT">
  <link rel="canonical" href="https://dianlijuhe.com/">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="聚合平台-chatGPT">
  <meta property="og:title" content="文章详情 - AI聚合">
  <meta property="og:description" content="ChatGPT 实战教程与深度解读。">
  <meta property="og:url" content="https://dianlijuhe.com/">
  <meta property="og:image" content="https://dianlijuhe.com/images/logo.svg">
  <meta name="twitter:card" content="summary">
  <!-- 结构化数据：由 js/main.js 按当前文章动态填充 -->
  <script type="application/ld+json" id="articleSchema">{}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="logo">AI</span>
        <span class="brand-name">聚合</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html#articles">文章</a>
        <a href="index.html#categories">分类</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="切换深色模式" title="深色 / 浅色">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
        <button class="hamburger" id="hamburger" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="index.html#articles">文章</a>
    <a href="index.html#categories">分类</a>
  </div>

  <!-- ===== 文章头 ===== -->
  <section class="post-hero">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">首页</a> / <a href="index.html#articles" id="crumbCat">文章</a> / <span id="crumbTitle">详情</span></nav>
      <h1 class="post-title" id="postTitle">加载中…</h1>
      <div class="post-meta">
        <span class="author"><span class="avatar" id="postAvatar">AI</span><span id="postAuthor">编辑部</span></span>
        <span id="postDate">—</span>
        <span id="postRead">—</span>
        <span id="postCat" class="chip" style="cursor:default">—</span>
      </div>
    </div>
  </section>

  <!-- ===== 首图 + 正文 + 目录（同一两列布局，目录顶部与首图顶部齐平） ===== -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="post-layout">
        <div class="post-main">
          <div class="post-cover" id="postCover"><span class="emoji" id="postCoverEmoji">🤖</span></div>
          <article class="article" id="postContent">
            <!-- 正文由 JS 注入 -->
          </article>
        </div>
        <aside class="toc" id="toc" aria-label="文章目录">
          <h4>目录</h4>
          <nav id="tocList"></nav>
          <!-- 分享到微信：目录框底部（仅 PC 端显示） -->
          <div class="toc-share wechat-share">
            <button type="button" class="share-btn wechat-share-btn" id="wechatShareBtn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              分享到微信
            </button>
          </div>
        </aside>
      </div>

      <!-- 看完文章后的免费体验引导（原分享栏位置） -->
      <div class="post-cta">
        <div class="post-cta-copy">
          <p><span class="post-cta-hl">点击</span>下方按钮，打开网页就能用上 ChatGPT等主流 AI，无需下载安装，注册即可免费体验。</p>
        </div>
        <a class="post-cta-btn" href="https://oai.oooai.cc/list/#/register?inviter=PV0KQ6" target="_blank" rel="noopener noreferrer">
          <span>免费体验</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <!-- 相关文章 -->
      <div class="comments">
        <h2 style="margin-bottom:18px">🔗 相关阅读</h2>
        <div class="related-grid" id="relatedGrid"></div>
      </div>

      <!-- 评论区（暂未开放） -->
    </div>
  </section>

  <!-- ===== 页脚 ===== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 AI聚合 · 保留所有权利</span>
        <span><a href="index.html">返回首页</a></span>
      </div>
    </div>
  </footer>

  <!-- 微信分享二维码弹窗 -->
  <div class="wechat-modal" id="wechatModal" role="dialog" aria-modal="true" aria-labelledby="wechatModalTitle" hidden>
    <div class="wechat-modal-backdrop" data-close></div>
    <div class="wechat-modal-box">
      <button type="button" class="wechat-modal-close" data-close aria-label="关闭">&times;</button>
      <h3 id="wechatModalTitle">分享到微信</h3>
      <div class="wechat-modal-qr" id="wechatQr"></div>
      <p class="wechat-modal-tip">用微信「扫一扫」打开，再点右上角 <b>···</b> 分享给好友或朋友圈</p>
    </div>
  </div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/posts-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
